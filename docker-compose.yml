services:
  quantdesk-research:
    build:
      context: research/python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      QUANTDESK_ENABLE_ALPACA: "false"
      # Python 3.14's current hmmlearn Linux wheel omits this runtime dependency.
      # Preload the image-provided library so regime validation remains available.
      LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libstdc++.so.6
    volumes:
      - quantdesk-research-data:/app/data
      - quantdesk-research-artifacts:/app/artifacts
    restart: unless-stopped

  quantdesk-research-worker:
    build:
      context: research/python
      dockerfile: Dockerfile
    # Keep the validation cadence inside the half-horizon dataset freshness budget.
    command: ["python", "-m", "quantdesk_research.cli.main", "worker", "--data-root", "/app/data", "--interval-seconds", "1800"]
    environment:
      QUANTDESK_ENABLE_ALPACA: "false"
      # Keep the worker's HMM capability identical to the research API.
      LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libstdc++.so.6
    volumes:
      - quantdesk-research-data:/app/data
      - quantdesk-research-artifacts:/app/artifacts
    depends_on:
      quantdesk-research:
        condition: service_healthy
    restart: unless-stopped

  quantdesk-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          IFS= read -r status <&3 && [[ "$$status" == *" 200 "* ]]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      APCA_API_BASE_URL: ${APCA_API_BASE_URL:?Set APCA_API_BASE_URL to the Alpaca paper endpoint}
      APCA_API_KEY_ID: ${APCA_API_KEY_ID:?Set APCA_API_KEY_ID outside this file}
      APCA_API_SECRET_KEY: ${APCA_API_SECRET_KEY:?Set APCA_API_SECRET_KEY outside this file}
      # Blank means operator-only endpoints fail closed; autonomous execution never uses this key.
      QUANTDESK_OPERATOR_KEY: ${QUANTDESK_OPERATOR_KEY:-}
      QUANTDESK_SYMBOLS: ${QUANTDESK_SYMBOLS:-SPY,BTC/USD}
      QUANTDESK_MAX_PAPER_ORDER_NOTIONAL: ${QUANTDESK_MAX_PAPER_ORDER_NOTIONAL:-1000}
      # Alpaca rejected a $5 BTC/USD diagnostic below its $10 minimum on 2026-08-31.
      QUANTDESK_DIAGNOSTIC_MAX_NOTIONAL: ${QUANTDESK_DIAGNOSTIC_MAX_NOTIONAL:-10}
      QUANTDESK_DIAGNOSTIC_STORE_PATH: /app/runtime-data/diagnostic-executions.json
      QUANTDESK_AUTONOMOUS_ENABLED: ${QUANTDESK_AUTONOMOUS_ENABLED:-true}
      QUANTDESK_AUTONOMOUS_MODE: ${QUANTDESK_AUTONOMOUS_MODE:-ExperimentalPaper}
      QUANTDESK_EXPERIMENT_ID: ${QUANTDESK_EXPERIMENT_ID:-EXP-001}
      QUANTDESK_HYPOTHESIS_ID: ${QUANTDESK_HYPOTHESIS_ID:-QD-CAUSAL-MOMENTUM-001}
      QUANTDESK_STRATEGY_VERSION: ${QUANTDESK_STRATEGY_VERSION:-EXP-001-v1}
      QUANTDESK_EVIDENCE_REFERENCE: ${QUANTDESK_EVIDENCE_REFERENCE:-research.md#iteration-3}
      QUANTDESK_EXPERIMENT_REGISTERED_AT: ${QUANTDESK_EXPERIMENT_REGISTERED_AT:-2026-08-30T00:00:00Z}
      QUANTDESK_LEAKAGE_SANITY_PASSED: ${QUANTDESK_LEAKAGE_SANITY_PASSED:-true}
      QUANTDESK_REPLAY_SANITY_PASSED: ${QUANTDESK_REPLAY_SANITY_PASSED:-true}
      QUANTDESK_AUTONOMOUS_SYMBOL: ${QUANTDESK_AUTONOMOUS_SYMBOL:-BTC/USD}
      QUANTDESK_AUTONOMOUS_ORDER_NOTIONAL: ${QUANTDESK_AUTONOMOUS_ORDER_NOTIONAL:-5}
      # This is a long safety expiry, not an entry/exit timer. Thesis, regime, and loss rules manage exits.
      QUANTDESK_AUTONOMOUS_MAX_HOLDING_HOURS: ${QUANTDESK_AUTONOMOUS_MAX_HOLDING_HOURS:-2}
      QUANTDESK_AUTONOMOUS_FILL_TIMEOUT_SECONDS: ${QUANTDESK_AUTONOMOUS_FILL_TIMEOUT_SECONDS:-30}
      QUANTDESK_AUTONOMOUS_CYCLE_INTERVAL_SECONDS: ${QUANTDESK_AUTONOMOUS_CYCLE_INTERVAL_SECONDS:-60}
      QUANTDESK_RESEARCH_BASE_URL: http://quantdesk-research:8000
      QUANTDESK_RESEARCH_DATA_ROOT: /app/research-data
      QUANTDESK_RESEARCH_ARTIFACT_ROOT: /app/research-artifacts
      QUANTDESK_RESEARCH_LOOKBACK_DAYS: ${QUANTDESK_RESEARCH_LOOKBACK_DAYS:-180}
      # Bound authenticated quote collection while building the next point-in-time research dataset.
      QUANTDESK_QUOTE_CAPTURE_INTERVAL_SECONDS: ${QUANTDESK_QUOTE_CAPTURE_INTERVAL_SECONDS:-5}
    volumes:
      - quantdesk-runtime-data:/app/runtime-data
      - quantdesk-research-data:/app/research-data
      - quantdesk-research-artifacts:/app/research-artifacts:ro
    depends_on:
      quantdesk-research:
        condition: service_healthy
    restart: unless-stopped

volumes:
  quantdesk-runtime-data:
    name: quantdesk-runtime-data
  quantdesk-research-data:
    name: quantdesk-research-data
    external: true
  quantdesk-research-artifacts:
    name: quantdesk-research-artifacts
    external: true
