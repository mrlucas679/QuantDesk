services:
  # Populates the research-data volume from the datasets committed to this repository, then exits.
  # Without it a fresh machine starts with an empty volume and every research service has nothing
  # to read, which is the difference between "clone and run" and "clone, then hunt for data".
  # Re-running is safe: existing files are not overwritten.
  quantdesk-dataset-seed:
    image: alpine:3.20
    # BusyBox cp -n silently copies nothing, so idempotency is an explicit emptiness check
    # rather than a no-clobber flag. A dataset already present is left untouched.
    command:
      - sh
      - -c
      - >-
        set -e;
        for dataset in /seed-source/*/; do
          name=$$(basename "$$dataset");
          if [ -d "/seed-target/$$name" ] && [ -n "$$(ls -A "/seed-target/$$name" 2>/dev/null)" ]; then
            echo "dataset already present: $$name";
          else
            mkdir -p "/seed-target/$$name";
            cp -r "$$dataset". "/seed-target/$$name/";
            echo "seeded dataset: $$name ($$(ls -1 "/seed-target/$$name" | wc -l) files)";
          fi;
        done
    volumes:
      - ./research/python/data:/seed-source:ro
      - quantdesk-research-data:/seed-target
    restart: "no"

  quantdesk-research:
    build:
      context: research/python
      dockerfile: Dockerfile
    ports:
      # Agent harnesses on this machine can connect; other LAN hosts cannot reach the unauthenticated
      # research surface. Container peers still use quantdesk-research:8000 on the Compose network.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      QUANTDESK_ENABLE_ALPACA: "false"
      # Python 3.14's current hmmlearn Linux wheel omits this runtime dependency.
      # Preload the image-provided library so regime validation remains available.
      LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libstdc++.so.6
    volumes:
      - quantdesk-research-data:/app/data
      - quantdesk-research-artifacts:/app/artifacts
    depends_on:
      quantdesk-dataset-seed:
        condition: service_completed_successfully
    restart: unless-stopped

  quantdesk-research-worker:
    build:
      context: research/python
      dockerfile: Dockerfile
    # Keep the validation cadence inside the half-horizon dataset freshness budget.
    command: ["python", "-m", "quantdesk_research.cli.main", "worker", "--data-root", "/app/data", "--interval-seconds", "1800"]
    environment:
      QUANTDESK_ENABLE_ALPACA: "false"
      # Keep the worker's HMM capability identical to the research API.
      LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libstdc++.so.6
      # The commit a fitted model artifact was produced by. The exporter refuses to write one
      # without it: an artifact that cannot name the code behind it cannot be traced back from a
      # live decision, which is most of what its manifest is for.
      QUANTDESK_GIT_COMMIT: ${QUANTDESK_GIT_COMMIT:-14cb624}
    volumes:
      - quantdesk-research-data:/app/data
      - quantdesk-research-artifacts:/app/artifacts
    depends_on:
      quantdesk-research:
        condition: service_healthy
    restart: unless-stopped

  quantdesk-fault-campaign:
    build:
      context: .
      dockerfile: Dockerfile.fault-campaign
    volumes:
      - quantdesk-runtime-data:/runtime-data
    restart: "no"

  quantdesk-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          IFS= read -r status <&3 && [[ "$$status" == *" 200 "* ]]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Credentials come from the .env file directly, not from ${...} interpolation.
    #
    # Interpolation reads the *shell* environment first and only falls back to .env, so a stale
    # APCA_API_KEY_ID left in a user's environment silently overrides the file they just edited. That
    # happened: the CLI (reading .env) authenticated while this container 401'd on a key/secret pair
    # assembled from two different generations, and nothing in either place looked wrong.
    #
    # env_file loads the file into the container without consulting the shell at all, which makes .env
    # the single source of truth for credentials and this class of confusion impossible.
    env_file:
      - .env
    # Only values that must differ inside the container, or that .env does not define, are set here.
    #
    # Anything listed under `environment:` overrides `env_file`, so every `${VAR:-default}` entry
    # silently replaced the operator's .env value with a shell value or a hardcoded default. That cost
    # a working operator key (blank -> 401 on every operator endpoint) and, before it, a working
    # Alpaca credential pair. Duplicating a .env key here does not add a default; it takes control away
    # from the file the operator edits.
    environment:
      # Blank means operator-only endpoints fail closed; autonomous execution never uses this key.
      # Alpaca rejected a $5 BTC/USD diagnostic below its $10 minimum on 2026-08-31.
      QUANTDESK_DIAGNOSTIC_STORE_PATH: /app/runtime-data/diagnostic-executions.json
      # Durable execution records for the multi-leg and spot lanes. Both live on the runtime-data
      # volume so recovery survives a container restart rather than only a process restart.
      QUANTDESK_MLEG_STORE_PATH: /app/runtime-data/mleg-executions.json
      QUANTDESK_SPOT_STORE_PATH: /app/runtime-data/spot-executions.json
      QUANTDESK_FAULT_CAMPAIGN_PATH: /app/runtime-data/fault-campaign.json
      QUANTDESK_AGENT_STORE_PATH: /app/runtime-data/agent-runs.json
      # Agent providers are opt-in. When disabled, deterministic trading and exits continue.
      QUANTDESK_AGENTS_ENABLED: ${QUANTDESK_AGENTS_ENABLED:-false}
      QUANTDESK_AGENT_BASE_URL: ${QUANTDESK_AGENT_BASE_URL:-}
      QUANTDESK_AGENT_MODEL: ${QUANTDESK_AGENT_MODEL:-qwen3:8b}
      # No execution symbol is implicit. Disabled research services retain their own BTC/USD
      # dataset fallback, but enabling autonomy requires an explicit chosen symbol.
      # Spot holds the instrument; DefinedRiskVertical expresses the view as a debit spread.
      # Also the hard cap on what one opportunity can lose. A vertical needs 500; at 20 every
      # spread is refused as uneconomic once per-contract fees are counted.
      # This is a long safety expiry, not an entry/exit timer. Thesis, regime, and loss rules manage exits.
      QUANTDESK_RESEARCH_BASE_URL: http://quantdesk-research:8000
      QUANTDESK_RESEARCH_DATA_ROOT: /app/research-data
      QUANTDESK_RESEARCH_ARTIFACT_ROOT: /app/research-artifacts
      QUANTDESK_RESEARCH_LOOKBACK_DAYS: ${QUANTDESK_RESEARCH_LOOKBACK_DAYS:-180}
      # Research requires SIP and rejects anything else; IEX is the default because SIP is paid.
      # Bound authenticated quote collection while building the next point-in-time research dataset.
      QUANTDESK_QUOTE_CAPTURE_INTERVAL_SECONDS: ${QUANTDESK_QUOTE_CAPTURE_INTERVAL_SECONDS:-5}
      # Where each session's replay log is written. On a volume rather than the container
      # filesystem, because the start-up replay reads the *previous* session -- and a log that died
      # with the container it was written in would leave nothing to replay after every restart,
      # which is precisely when the check is worth running.
      QUANTDESK_REPLAY_LOG_ROOT: /app/replay-logs
    volumes:
      - quantdesk-runtime-data:/app/runtime-data
      - quantdesk-research-data:/app/research-data
      - quantdesk-research-artifacts:/app/research-artifacts:ro
      - quantdesk-replay-logs:/app/replay-logs
    depends_on:
      quantdesk-research:
        condition: service_healthy
      quantdesk-fault-campaign:
        condition: service_completed_successfully
    restart: unless-stopped

  quantdesk-dashboard:
    build:
      context: dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      quantdesk-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # One replay log per session, kept across restarts so the previous one can be replayed.
  quantdesk-replay-logs:
  quantdesk-runtime-data:
    name: quantdesk-runtime-data
  quantdesk-research-data:
    name: quantdesk-research-data
  quantdesk-research-artifacts:
    name: quantdesk-research-artifacts
    external: true
