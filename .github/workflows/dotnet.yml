name: dotnet

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Prevent a polluted/shared NuGet cache from hiding missing analyzer assemblies.
      - run: dotnet nuget locals all --clear
      - run: dotnet restore QuantDesk.slnx --force
      - run: dotnet build QuantDesk.slnx --no-restore --configuration Release
      - run: dotnet test QuantDesk.slnx --no-build --configuration Release
